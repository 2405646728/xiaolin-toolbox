[package]
name = "xiaolin-toolbox"
version = "1.0.0"
description = "小林的工具箱 - 跨平台系统优化集成"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# 库定义（lib + main 双入口，支持桌面与移动端）
[lib]
name = "xiaolin_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
