[package]
name = "xiaolin-ai"
version = "1.2.1"
description = "小林 AI - 对话型 AI 助手"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# 库定义（lib + main 双入口，支持桌面与移动端）
[lib]
name = "xiaolin_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
xcap = "0.0.14"
arboard = "3"
base64 = "0.22"
image = "0.25"
regex-lite = "0.1"

# Windows 平台特定依赖（窗口管理使用 Win32 API）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
